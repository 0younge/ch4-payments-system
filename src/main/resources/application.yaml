spring:
  application:
    name: ch4-payments-system

  datasource:
    url: ${DB_URL:jdbc:h2:mem:ch4_payments_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    defer-datasource-initialization: true  # 테이블 먼저 만들고 data.sql 돌려야함
  sql:
    init:
      mode: always  # data.sql 항상 실행 되게하는 것

