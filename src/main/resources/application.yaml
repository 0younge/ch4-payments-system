spring:
  application:
    name: ch4-payments-system

  datasource:
    url: ${DB_URL:jdbc:h2:mem:ch4_payments_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create}
    defer-datasource-initialization: true

  sql:
    init:
      mode: always